{% extends "account/base.html" %}
{% load i18n %}

{% block title %}{% trans "Recuperar Senha" %} - PROSPECTA{% endblock %}

{% block content %}
<div class="space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-gray-900">{% trans "Recuperar Senha" %}</h1>
        <p class="mt-2 text-gray-600">{% trans "Digite seu email para receber instruções" %}</p>
    </div>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        
        <!-- Email -->
        <div>
            <label for="id_email" class="block text-sm font-medium text-gray-700 mb-1">
                {% trans "Email" %}
            </label>
            <input 
                type="email" 
                name="email" 
                id="id_email" 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                placeholder="seu@email.com"
                required
            >
        </div>

        <!-- Botão Enviar -->
        <button 
            type="submit" 
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition"
        >
            {% trans "Enviar Instruções" %}
        </button>
    </form>

    <!-- Voltar para Login -->
    <div class="text-center text-sm">
        <a href="{% url 'account_login' %}" class="text-blue-600 hover:text-blue-700 font-medium">
            ← {% trans "Voltar para login" %}
        </a>
    </div>
</div>

{% endblock %}
