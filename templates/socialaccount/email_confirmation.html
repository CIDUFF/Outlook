{% extends "socialaccount/base.html" %}

{% block title %}Confirmação de Email - PROSPECTA{% endblock %}

{% block content %}
<div class="space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-gray-900">Confirmar Email</h1>
        <p class="mt-2 text-gray-600">Verificamos seu email para conectar sua conta</p>
    </div>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        
        <div class="bg-green-50 border border-green-200 rounded-lg p-4">
            <p class="text-green-800">
                <i class="fas fa-check-circle mr-2"></i>
                Email verificado com sucesso!
            </p>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition">
            Continuar
        </button>
    </form>

    <!-- Link para voltar -->
    <div class="text-center pt-4">
        <a href="{% url 'account_login' %}" class="text-blue-600 hover:text-blue-700 font-medium">
            ← Voltar
        </a>
    </div>
</div>

{% endblock %}
