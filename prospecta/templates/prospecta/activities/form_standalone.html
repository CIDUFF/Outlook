{% extends 'prospecta/base.html' %}
{% load static %}

{% block title %}Nova Atividade - PROSPECTA{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">Nova Atividade</h1>

        <div class="bg-white rounded-lg shadow-md p-6">
            <form method="post" class="space-y-6">
                {% csrf_token %}

                <!-- Seleção de Oportunidade e Etapa -->
                <div class="bg-purple-50 border border-purple-200 rounded-lg p-4 space-y-4">
                    <h3 class="font-semibold text-purple-800 flex items-center">
                        <i class="fas fa-folder-open mr-2"></i>Vincular à Oportunidade
                    </h3>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Oportunidade *</label>
                        <select name="opportunity" id="opportunity-select" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                            <option value="">-- Selecione uma oportunidade --</option>
                            {% for opp in opportunities %}
                                <option value="{{ opp.pk }}" data-stages='[{% for stage in opp.stages.all %}{"id":"{{ stage.pk }}","name":"{{ stage.name }}"}{% if not forloop.last %},{% endif %}{% endfor %}]'>
                                    {{ opp.title }} - {{ opp.client.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Etapa *</label>
                        <select name="stage" id="stage-select" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                            <option value="">-- Primeiro selecione uma oportunidade --</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Título da Atividade *</label>
                    <input type="text" name="title" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Ex: Enviar proposta comercial">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Descrição</label>
                    <textarea name="description" rows="4"
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                              placeholder="Descreva os detalhes da atividade..."></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Entregável</label>
                    <input type="text" name="entregavel" 
                           maxlength="255"
                           placeholder="Ex: Proposta comercial, Relatório, Contrato..."
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Tipo de Atividade</label>
                    <select name="activity_type" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="tarefa">📋 Tarefa</option>
                        <option value="reuniao">📅 Reunião</option>
                        <option value="ligacao">☎️ Ligação</option>
                        <option value="email">📧 Email</option>
                        <option value="proposta">📄 Proposta</option>
                        <option value="follow_up">🔄 Follow-up</option>
                        <option value="outro">📌 Outro</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Data de Início</label>
                        <input type="date" name="start_date" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Data Esperada</label>
                        <input type="date" name="expected_date" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Atribuir Para</label>
                    <select name="assigned_to" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">-- Sem atribuição (você será responsável) --</option>
                        {% for user in users %}
                            <option value="{{ user.id }}">
                                {{ user.get_full_name }} ({{ user.profile.get_role_display }})
                            </option>
                        {% endfor %}
                    </select>
                    <p class="text-xs text-gray-500 mt-1">O usuário selecionado será notificado por email e pelo sistema.</p>
                </div>

                <div class="flex gap-4 pt-6 border-t border-gray-200">
                    <button type="submit" class="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">
                        <i class="fas fa-plus mr-2"></i>Criar Atividade
                    </button>
                    <a href="{% url 'prospecta:activities_list' %}" 
                       class="px-6 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition">
                        <i class="fas fa-times mr-2"></i>Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const opportunitySelect = document.getElementById('opportunity-select');
    const stageSelect = document.getElementById('stage-select');

    opportunitySelect.addEventListener('change', function() {
        const selectedOption = this.options[this.selectedIndex];
        const stagesData = selectedOption.getAttribute('data-stages');
        
        // Limpar opções anteriores
        stageSelect.innerHTML = '<option value="">-- Selecione uma etapa --</option>';
        
        if (stagesData) {
            try {
                const stages = JSON.parse(stagesData);
                stages.forEach(function(stage) {
                    const option = document.createElement('option');
                    option.value = stage.id;
                    option.textContent = stage.name;
                    stageSelect.appendChild(option);
                });
            } catch (e) {
                console.error('Erro ao parsear etapas:', e);
            }
        }
    });
});
</script>
{% endblock %}
