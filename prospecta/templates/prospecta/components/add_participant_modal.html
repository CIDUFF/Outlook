<!-- Modal para Adicionar Participante com Alpine.js -->
<div x-cloak x-show="openAddParticipantModal" class="fixed inset-0 z-50 overflow-y-auto bg-black bg-opacity-50" @click.self="openAddParticipantModal = false" style="display: none;">
    <!-- Modal -->
    <div class="flex items-center justify-center min-h-screen px-4">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full" @click.stop>
            <!-- Header -->
            <div class="border-b px-6 py-4 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-900">
                    <i class="fas fa-user-plus mr-2 text-blue-600"></i>
                    Adicionar Participante
                </h3>
                <button @click="openAddParticipantModal = false" type="button" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <!-- Body -->
            <form method="POST" action="{% url 'prospecta:add_opportunity_participant' pk=opportunity.pk %}" class="px-6 py-4">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label for="participantSelect" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-user mr-2 text-blue-600"></i>
                        Selecione um Participante
                    </label>
                    <select name="user_id" id="participantSelect" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        <option value="">-- Escolha uma pessoa --</option>
                        {% for user in available_users %}
                            <option value="{{ user.id }}">
                                {{ user.get_full_name }} ({{ user.profile.get_role_display }})
                            </option>
                        {% endfor %}
                    </select>
                    {% if not available_users %}
                        <div class="mt-2 p-2 bg-blue-50 border border-blue-200 rounded text-sm text-blue-700">
                            <small>Todos os usuários ativos já são participantes.</small>
                        </div>
                    {% endif %}
                </div>

                <div class="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-lg">
                    <small class="text-blue-700 flex items-center">
                        <i class="fas fa-info-circle mr-2"></i>
                        Este participante será notificado por email.
                    </small>
                </div>
                
                <!-- Footer -->
                <div class="flex gap-3 justify-end">
                    <button type="button" @click="openAddParticipantModal = false" class="px-4 py-2 text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300 transition font-medium">
                        <i class="fas fa-times mr-1"></i>
                        Cancelar
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium" {% if not available_users %}disabled{% endif %}>
                        <i class="fas fa-check mr-1"></i>
                        Adicionar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
