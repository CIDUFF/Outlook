<!-- Breadcrumb Navigation Component -->
<nav class="bg-white border-b border-gray-200 px-4 sm:px-6 lg:px-8 py-2">
    <div class="max-w-7xl mx-auto">
        <ol class="flex items-center space-x-2 text-sm">
            {% for crumb in breadcrumbs %}
                <li>
                    {% if crumb.url %}
                        <a href="{{ crumb.url }}" class="text-blue-600 hover:text-blue-700 hover:underline transition">
                            <i class="fas fa-{{ crumb.icon }} mr-1"></i>{{ crumb.label }}
                        </a>
                    {% else %}
                        <span class="text-gray-700 font-semibold">
                            <i class="fas fa-{{ crumb.icon }} mr-1"></i>{{ crumb.label }}
                        </span>
                    {% endif %}
                </li>
                {% if not forloop.last %}
                    <li class="text-gray-400">
                        <i class="fas fa-chevron-right text-xs"></i>
                    </li>
                {% endif %}
            {% endfor %}
        </ol>
    </div>
</nav>
