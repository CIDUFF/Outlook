<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login com Google - PROSPECTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-600 to-blue-800 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md px-4">
        <!-- Card Principal -->
        <div class="bg-white rounded-lg shadow-2xl overflow-hidden">
            <!-- Header -->
            <div class="bg-gradient-to-r from-blue-600 to-blue-700 px-6 py-8 text-center">
                <div class="text-white mb-2">
                    <i class="fab fa-google text-4xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-white">PROSPECTA</h1>
                <p class="text-blue-100 text-sm mt-1">Gestão de Oportunidades</p>
            </div>

            <!-- Content -->
            <div class="px-6 py-8">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-gray-800">Login via Google</h2>
                    <p class="text-gray-600 text-sm mt-2">Conectando sua conta Google com PROSPECTA</p>
                </div>

                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
                    <p class="text-gray-700 text-sm">
                        <i class="fas fa-info-circle text-blue-500 mr-2"></i>
                        Você será redirecionado para autorizar o acesso com sua conta Google.
                    </p>
                </div>

                <div class="space-y-3">
                    {% load socialaccount %}
                    <a href="{% provider_login_url 'google' %}" class="w-full flex items-center justify-center px-4 py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-lg transition">
                        <i class="fab fa-google mr-2"></i>
                        Continuar com Google
                    </a>
                    
                    <a href="{% url 'account_login' %}" class="w-full flex items-center justify-center px-4 py-3 border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium rounded-lg transition">
                        <i class="fas fa-arrow-left mr-2"></i>
                        Voltar
                    </a>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-white text-sm mt-6">
            © 2025 NextMarte. Todos os direitos reservados.
        </p>
    </div>
</body>
</html>
