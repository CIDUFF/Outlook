{% load i18n %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block head_title %}PROSPECTA - Autenticação{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gradient-to-br from-blue-600 to-blue-800 min-h-screen flex items-center justify-center py-8">
    <div class="w-full max-w-md px-4">
        <!-- Card Principal -->
        <div class="bg-white rounded-lg shadow-2xl overflow-hidden">
            <!-- Header -->
            <div class="bg-gradient-to-r from-blue-600 to-blue-700 px-6 py-8 text-center">
                <div class="text-white mb-2">
                    <i class="fas fa-chart-line text-4xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-white">PROSPECTA</h1>
                <p class="text-blue-100 text-sm mt-1">Gestão de Oportunidades</p>
            </div>

            <!-- Content -->
            <div class="px-6 py-8">
                {% block content %}{% endblock %}
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-white text-sm mt-6">
            © 2025 NextMarte. Todos os direitos reservados.
        </p>
    </div>
</body>
</html>
