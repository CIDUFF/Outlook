{% extends "account/base.html" %}

{% block head_title %}Sucesso - PROSPECTA{% endblock %}

{% block content %}
<div class="text-center">
    <div class="inline-block">
        <i class="fas fa-check-circle text-6xl text-green-500 mb-4"></i>
    </div>
    <h1 class="text-2xl font-bold text-gray-800 mt-2 mb-1">Sucesso!</h1>
</div>

<p class="text-gray-700 text-base mb-6 text-center">
    Um email com instruções para recuperar sua senha foi enviado.
</p>

<!-- Actions -->
<div class="space-y-3">
    <a href="{% url 'account_login' %}" class="w-full flex items-center justify-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition">
        <i class="fas fa-sign-in-alt mr-2"></i>Ir para Login
    </a>
    <a href="{% url 'prospecta:home' %}" class="w-full flex items-center justify-center px-4 py-2 border border-blue-600 text-blue-600 hover:bg-blue-50 rounded-lg transition">
        <i class="fas fa-home mr-2"></i>Voltar ao Início
    </a>
</div>
{% endblock %}
