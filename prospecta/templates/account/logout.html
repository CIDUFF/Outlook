{% extends "account/base.html" %}

{% block head_title %}Sair - PROSPECTA{% endblock %}

{% block content %}
<div class="text-center">
    <h2 class="text-2xl font-bold text-gray-800 mb-1">Tem certeza que deseja sair?</h2>
    <i class="fas fa-sign-out-alt text-4xl text-blue-600 mt-4 mb-6 block"></i>
</div>

<p class="text-gray-600 text-sm mb-6 text-center">
    Você será desconectado do sistema.
</p>

<!-- Form -->
<form method="post" class="space-y-3">
    {% csrf_token %}
    
    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200 ease-in-out">
        <i class="fas fa-sign-out-alt mr-2"></i>Sim, sair
    </button>
    
    <a href="{% url 'prospecta:dashboard' %}" class="w-full flex items-center justify-center px-4 py-2 border border-gray-300 text-gray-700 hover:bg-gray-50 rounded-lg transition">
        <i class="fas fa-arrow-left mr-2"></i>Não, voltar
    </a>
</form>
{% endblock %}
